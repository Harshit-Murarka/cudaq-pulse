name: wheels

# Linux wheels include the GPU runtime; macOS wheels are compiler-only. Both
# are tested by cibuildwheel (see [tool.cibuildwheel] in pyproject.toml).
# Publishing to PyPI happens only for v* tags, through trusted publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheels (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm }
          - { platform: macos-aarch64, runner: macos-15 }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # On Linux the archive is unpacked inside the manylinux container by
      # tools/ci/manylinux-before-all.sh; on macOS the build runs on the host.
      - uses: ./.github/actions/mlir-toolchain
        with:
          unpack: ${{ runner.os == 'macOS' }}

      - uses: pypa/cibuildwheel@v4.3.1

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
      - run: uv build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.2
